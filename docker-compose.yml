services:
  postgres:
    image: postgres:16-alpine
    container_name: rasul_dip_postgres
    environment:
      POSTGRES_DB: rasul_dip
      POSTGRES_USER: rasul
      POSTGRES_PASSWORD: rasul
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasul -d rasul_dip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rasul_dip_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
